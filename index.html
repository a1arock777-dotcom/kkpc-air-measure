<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대기측정 관리</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--bd:#d9d6cc;--tx:#1f1e1b;--tx2:#6b6a64;--ac:#185fa5;--acbg:#e6f1fb;--wn:#854f0b;--wnbg:#faeeda;--ok:#3b6d11;--okbg:#eaf3de}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1c;--card:#2a2a27;--bd:#444441;--tx:#f1efe8;--tx2:#b4b2a9;--ac:#85b7eb;--acbg:#0c447c;--wn:#fac775;--wnbg:#633806;--ok:#c0dd97;--okbg:#27500a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;word-break:keep-all}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:17px;margin:0;font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
main{padding:14px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.muted{color:var(--tx2);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{min-height:78px;border:1px solid var(--bd);border-radius:8px;padding:4px;background:var(--card);cursor:pointer;overflow:hidden;font-size:12px}
.cal .d.sel{outline:2px solid var(--ac)}
.cal .d.today b{color:var(--ac)}
.cal .hd{text-align:center;color:var(--tx2);font-size:12px;padding:2px}
.tag{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:var(--acbg);color:var(--ac);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;margin:2px;padding:4px 10px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:5px 4px;text-align:left;vertical-align:middle}
td input{width:90px}
.scroll{overflow-x:auto}
.vs{max-height:72vh;overflow:auto}
table.grid{border-collapse:separate;border-spacing:0;border-top:1px solid var(--bd);border-left:1px solid var(--bd)}
table.grid th,table.grid td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
table.grid th{position:sticky;top:0;z-index:3;background:var(--bg)}
table.grid td:first-child,table.grid th:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
table.grid th:first-child{z-index:4;background:var(--bg)}
table.grid tr.blu td:first-child{background:#cfe8ff}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bad{color:var(--wn);background:var(--wnbg);padding:2px 6px;border-radius:4px;font-size:12px}
tr.yel td{background:#fff3a3 !important}
tr.blu td{background:#cfe8ff !important;color:#1f1e1b !important}
.tag.dn{background:#a9dcf7;color:#0a3a5c;font-weight:600}
.good{color:var(--ok);background:var(--okbg);padding:2px 6px;border-radius:4px;font-size:12px}
.nt{color:var(--wn);font-size:12px}.ok2{color:var(--tx2);font-size:12px}.tag small{opacity:.8}
@media (max-width:600px){.cal .d{min-height:56px;font-size:11px}.tag{font-size:10px}}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:var(--bg,#f6f6f4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card" style="width:100%;max-width:340px;margin:0">
<h1 style="font-size:18px;margin:0 0 4px">대기측정 관리</h1>
<div class="muted" style="margin-bottom:10px">금호석유화학 울산수지공장 × 미래숲</div>
<form id="lf" style="display:flex;flex-direction:column;gap:8px">
<input id="le" type="email" placeholder="이메일" autocomplete="username" required>
<input id="lp" type="password" placeholder="비밀번호" autocomplete="current-password" required>
<button class="pri" type="submit">로그인</button>
<div id="lm" class="muted" style="color:var(--wn)"></div>
<a href="#" id="lr" class="muted">비밀번호 설정·변경: 이메일 입력 후 여기를 누르면 재설정 메일이 갑니다</a>
</form></div></div>
<header>
<h1>대기측정 관리 <span class="muted">금호석유화학 울산수지공장 × 미래숲</span></h1>
<nav id="nav"></nav>
</header>
<main>
<div id="status" class="muted" style="margin-bottom:8px"></div>
<div id="view"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var DB=null, S={sched:{},fuel:{},reports:{},log:[]}, tab='sched', ym=new Date(), sel=null, role='금호';
ym=new Date(2026,10,1);
var P={year:2026,outlets:{}};
var CYC=['연1회','반기1회','분기1회','월2회','측정면제'];
var SHORT={'연1회':'연1','반기1회':'반기','분기1회':'분기','월2회':'월2','측정면제':'면제'};
function norm(s){s=String(s).replace(/\s+/g,'').trim();var u=s.toUpperCase();
 if(u==='SOX')return 'SOx';if(u==='NOX')return 'NOx';if(u==='THC'||s==='탄화수소')return 'THC';if(u==='CO')return 'CO';if(s==='스티렌')return '스틸렌';return s}
function pit(o,n){var O=P.outlets[o];if(!O)return null;for(var i=0;i<O.items.length;i++)if(O.items[i].n===n)return O.items[i];return null}
function cyc(x,n){return (x.cy&&x.cy[n])||(pit(x.o,n)?pit(x.o,n).c:'')}
function prange(k,c){var m=+k.slice(5,7);if(c==='연1회')return [1,12];if(c==='반기1회')return m<=6?[1,6]:[7,12];
 if(c==='분기1회'){var s=Math.floor((m-1)/3)*3+1;return [s,s+2]}if(c==='월2회')return [m,m];return null}
function rn(s){s=String(s).replace(/\(참고용\)/g,'').replace(/\s+/g,'');var u=s.toUpperCase();
 if(/THC|탄화수소/.test(u))return 'THC';if(u==='SOX'||s==='황산화물')return 'SOx';if(u==='NOX'||s==='질소산화물')return 'NOx';if(u==='CO'||s==='일산화탄소')return 'CO';if(s==='스티렌')return '스틸렌';return s}
var DONE=null,DONEN=-1;
function doneSet(){var n=Object.keys(S.reports).length;if(DONE&&DONEN===n)return DONE;DONE={};DONEN=n;
 Object.keys(S.reports).forEach(function(k){var r=S.reports[k];if(!r||!r.date)return;(r.rows||[]).forEach(function(x){DONE[r.date+'|'+r.outlet+'|'+rn(x.item)]=1})});return DONE}
function isDone(k,o,n){return !!doneSet()[k+'|'+o+'|'+rn(n)]}
function noteFor(k,o,n,c){
 var msg=[];if(!P.outlets[o])return '허가서에 없는 배출구 번호';
 var it=pit(o,n);if(!it)return '허가서에 없는 항목('+n+')';
 if(c==='측정면제')return '측정면제 항목입니다';
 if(n==='THC'&&{'A-109':1,'A-110':1,'A-154':1,'A-155':1}[o])return '허가서상 '+c+', 생기팀 요청으로 월1회 측정중';
 if(it.m)return it.m;
 var p=prange(k,c);if(!p)return '';var y=+k.slice(0,4);
 if(y===P.year&&c!=='월2회'){var ms=it.d.filter(function(m){return m>=p[0]&&m<=p[1]});
  if(ms.length)msg.push(c+' 측정인데 '+ms.join('·')+'월에 이미 측정함')}
 var ds=[];Object.keys(S.sched).sort().forEach(function(d){if(d===k||d.slice(0,4)!==k.slice(0,4))return;var mm=+d.slice(5,7);if(mm<p[0]||mm>p[1])return;
  (S.sched[d].items||[]).forEach(function(x){if(x.o===o&&x.it.map(norm).indexOf(n)>=0)ds.push(+d.slice(5,7)+'/'+(+d.slice(8,10)))})});
 if(ds.length&&!(c==='월2회'&&ds.length<2))msg.push(c+' 측정인데 '+ds.join(', ')+'에도 일정이 등록되어 있음');
 return msg.join(' / ')}
function flat(prefix){var a=[];Object.keys(S.sched).sort().forEach(function(k){if(prefix&&k.indexOf(prefix)!==0)return;(S.sched[k].items||[]).forEach(function(x){x.it.forEach(function(n){n=norm(n);var c=cyc(x,n);a.push({k:k,o:x.o,n:n,c:c,note:x.note||''})})})});return a}

var TABS=[['sched','일정'],['fuel','연료사용량'],['rep','성적서'],['q','배출구별 조회'],['rm','올해 잔여측정']];
function $(s){return document.querySelector(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else if(k.slice(0,2)==='on')e[k]=a[k];else e.setAttribute(k,a[k])}
 (Array.isArray(c)?c:(c==null?[]:[c])).forEach(function(x){e.appendChild(typeof x==='string'||typeof x==='number'?document.createTextNode(x):x)});return e}
function pad(n){return (n<10?'0':'')+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function rowsOf(snap){var o=[];var arr=snap&&snap.docs?snap.docs:[];if(!arr.length&&snap&&snap.forEach){snap.forEach(function(d){arr.push(d)})}
 arr.forEach(function(d){var v=typeof d.data==='function'?d.data():d.data;o.push({id:d.id,v:v||{}})});return o}
function save(coll,id,obj){try{DB.collection(coll).doc(id).set(obj).catch(function(e){status('저장 실패: '+e.message)})}catch(e){status('저장 실패: '+e.message)}}
function del(coll,id){try{DB.collection(coll).doc(id).delete().catch(function(e){status('삭제 실패: '+e.message)})}catch(e){}}
function status(t){$('#status').textContent=t}
var ME={email:'',role:'',admin:false};
function init(){
 render();
 status('공유 저장소에 연결됨 · '+ME.email);
 [['schedule','sched'],['fuel','fuel'],['reports','reports']].forEach(function(p){
  DB.collection(p[0]).onSnapshot(function(snap){var o={};rowsOf(snap).forEach(function(r){o[r.id]=r.v});S[p[1]]=o;safeRender()},function(e){status('읽기 실패('+p[0]+'): '+e.message)})});
}
var PEND=false;
function safeRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a)){PEND=true;return}render()}
document.addEventListener('focusout',function(){if(PEND){PEND=false;setTimeout(function(){var a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render()},150)}});
function render(){
 var n=$('#nav');n.innerHTML='';
 TABS.forEach(function(t){n.appendChild(el('button',{class:tab===t[0]?'on':'',onclick:function(){tab=t[0];render()}},t[1]))});
 if(ME.admin){var r=el('select',{onchange:function(){role=this.value;render()}},['금호','미래숲'].map(function(x){var o=el('option',{value:x},x+' 보기');if(x===role)o.selected=true;return o}));n.appendChild(r)}
 else n.appendChild(el('span',{class:'muted'},({vendor:'업체(미래숲)',viewer:'조회전용'})[ME.role]||''));
 n.appendChild(el('button',{onclick:function(){window.FBlogout()}},'로그아웃'));
 var v=$('#view');v.innerHTML='';
 ({sched:vSched,fuel:vFuel,rep:vRep,q:vQuery,rm:vRemain})[tab](v);
}
/* 일정 */
var XPREV=null;
function vSched(v){
 var y=ym.getFullYear(),m=ym.getMonth();
 var head=el('div',{class:'row',style:'justify-content:space-between;margin-bottom:8px'},[
  el('button',{onclick:function(){ym=new Date(y,m-1,1);render()}},'◀'),
  el('b',null,y+'년 '+(m+1)+'월'),
  el('button',{onclick:function(){ym=new Date(y,m+1,1);render()}},'▶')]);
 var c=el('div',{class:'card'},[head,el('div',{class:'muted',style:'margin-bottom:6px'},role==='미래숲'?'날짜 칸을 누르면 아래에 그날의 일정 목록과 "수기 입력" 창이 열립니다. 엑셀로 한 번에 올릴 수도 있습니다.':'날짜 칸을 누르면 아래에 그날의 측정 일정이 표시됩니다.')]);
 var g=el('div',{class:'cal'});
 ['일','월','화','수','목','금','토'].forEach(function(d){g.appendChild(el('div',{class:'hd'},d))});
 var first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 for(var i=0;i<first;i++)g.appendChild(el('div'));
 for(var d=1;d<=last;d++){(function(d){
  var k=key(y,m,d),it=(S.sched[k]&&S.sched[k].items)||[];
  var cell=el('div',{class:'d'+(sel===k?' sel':''),onclick:function(){sel=k;render()}},[el('b',null,d)]);
  it.slice(0,3).forEach(function(x){var all=x.it.every(function(n){return isDone(k,x.o,n)});cell.appendChild(el('span',{class:'tag'+(all?' dn':'')},(all?'✓ ':'')+x.o+' '+x.it.map(function(n){n=norm(n);var c=cyc(x,n);return n+(c?'('+SHORT[c]+')':'')}).join('·')))});
  if(it.length>3)cell.appendChild(el('span',{class:'tag'},'+'+(it.length-3)));
  g.appendChild(cell)})(d)}
 c.appendChild(g);v.appendChild(c);
 if(role==='미래숲'){v.appendChild(uploadPanel());if(XPREV)v.appendChild(previewPanel())}
 if(sel)v.appendChild(dayPanel(sel));
 v.appendChild(monthTable(y,m));
 if(role==='미래숲')v.appendChild(importPanel());
 v.appendChild(logPanel());
}
function monthTable(y,m){
 var c=el('div',{class:'card'},[el('b',null,(m+1)+'월 측정 일정 목록'),el('div',{class:'muted'},'이미 측정했거나 같은 기간에 일정이 또 있으면 비고에 안내됩니다. (등록은 막지 않습니다)'),el('div',{style:'margin:6px 0;font-size:13px'},[el('span',{style:'background:#cfe8ff;color:#1f1e1b;padding:2px 8px;border-radius:4px'},'하늘색 = 측정 완료(그날 성적서가 저장된 항목)')])]);
 var rows=flat(y+'-'+pad(m+1));var t=el('table');
 t.appendChild(el('tr',null,['날짜','배출구','항목','주기','비고'].map(function(h){return el('th',null,h)})));
 var WD=['일','월','화','수','목','금','토'];
 rows.forEach(function(r){var dt=new Date(+r.k.slice(0,4),+r.k.slice(5,7)-1,+r.k.slice(8,10));
  var nt=noteFor(r.k,r.o,r.n,r.c);
  var dn=isDone(r.k,r.o,r.n);
  t.appendChild(el('tr',{class:dn?'blu':''},[el('td',null,(+r.k.slice(5,7))+'/'+(+r.k.slice(8,10))+'('+WD[dt.getDay()]+')'),el('td',null,r.o),el('td',null,r.n),el('td',null,r.c||'-'),el('td',{class:nt?'nt':'ok2'},(dn?'✓ 측정 완료 ':'')+(nt||(r.note||'')))]))});
 if(!rows.length)c.appendChild(el('div',{class:'muted'},'이 달에 등록된 일정이 없습니다.'));
 c.appendChild(el('div',{class:'scroll'},t));return c}
function cloneItems(a){return a.map(function(x){return {o:x.o,it:x.it.map(norm),cy:Object.assign({},x.cy||{}),note:x.note||''}})}
function addTo(list,o,n,c,note){
 var e=null;list.forEach(function(x){if(x.o===o)e=x});
 if(!e){e={o:o,it:[],cy:{},note:''};list.push(e)}
 if(e.it.indexOf(n)<0)e.it.push(n);e.cy[n]=c||'';if(note)e.note=e.note?e.note+' '+note:note;return list}
function dayPanel(k){
 var cur=(S.sched[k]&&S.sched[k].items)||[];
 var c=el('div',{class:'card'},[el('b',null,k+' 측정 일정')]);
 cur.forEach(function(x,i){x.it.forEach(function(n0,j){var n=norm(n0),cy=cyc(x,n),nt=noteFor(k,x.o,n,cy);
  var line=el('div',{class:'row',style:'margin:4px 0'},[el('span',{class:'tag',style:'display:inline-block'},x.o+' '+n+(cy?' ('+cy+')':'')),el('span',{class:nt?'nt':'ok2'},nt||'')]);
  if(role==='미래숲')line.appendChild(el('button',{onclick:function(){var l=cloneItems(cur);var e=l[i];e.it.splice(j,1);delete e.cy[n];if(!e.it.length)l.splice(i,1);putDay(k,l,'삭제 '+x.o+' '+n)}},'삭제'));
  c.appendChild(line)});
  if(x.note)c.appendChild(el('div',{class:'muted'},x.o+' 메모: '+x.note))});
 if(!cur.length)c.appendChild(el('div',{class:'muted'},'등록된 측정이 없습니다.'));
 if(role==='미래숲'){
  c.appendChild(el('hr'));
  c.appendChild(el('b',null,'수기 입력'));
  var o=el('input',{placeholder:'배출구 예: A-102',size:12,list:'olist'});
  var dl=el('datalist',{id:'olist'},Object.keys(P.outlets).map(function(k2){return el('option',{value:k2},P.outlets[k2].desc)}));
  var si=el('select'),sc=el('select'),note=el('input',{placeholder:'메모(선택)',size:14}),pv=el('div',{class:'nt'}),ds=el('div',{class:'muted'});
  function norO(){return o.value.trim().replace(/^#/,'').toUpperCase().replace(/^A(\d)/,'A-$1')}
  function fillItems(){var oo=norO(),O=P.outlets[oo];si.innerHTML='';sc.innerHTML='';
   if(!O){ds.textContent=oo?'허가서에 없는 배출구 번호입니다(그래도 등록은 가능).':'';
    ['먼지','THC','SOx','NOx','기타'].forEach(function(n){si.appendChild(el('option',{value:n},n))});fillCyc('')}
   else{ds.textContent=O.desc+(O.memo?' · '+O.memo:'');O.items.forEach(function(it){si.appendChild(el('option',{value:it.n},it.n))});fillCyc(O.items[0].c)}
   prev()}
  function fillCyc(def){sc.innerHTML='';CYC.forEach(function(x){var op=el('option',{value:x},x);if(x===def)op.selected=true;sc.appendChild(op)})}
  function prev(){var oo=norO();if(!oo||!si.value){pv.textContent='';return}pv.textContent=noteFor(k,oo,si.value,sc.value)}
  o.onchange=fillItems;o.oninput=function(){if(P.outlets[norO()])fillItems()};
  si.onchange=function(){var it=pit(norO(),si.value);if(it)fillCyc(it.c);prev()};sc.onchange=prev;
  c.appendChild(el('div',{class:'row',style:'margin-top:6px'},[o,dl,el('span',{class:'muted'},'측정항목'),si,el('span',{class:'muted'},'측정주기'),sc,note]));
  c.appendChild(ds);c.appendChild(pv);
  c.appendChild(el('button',{class:'pri',style:'margin-top:6px',onclick:function(){
   var oo=norO();
   if(!/^A-\d+$/.test(oo)){status('배출구 번호를 A-숫자 형식으로 입력하세요');return}
   if(!si.value){status('측정항목을 고르세요');return}
   putDay(k,addTo(cloneItems(cur),oo,si.value,sc.value,note.value.trim()),'추가 '+oo+' '+si.value)}},'일정 추가'));
  fillItems();
 }else c.appendChild(el('div',{class:'muted',style:'margin-top:6px'},'금호 보기는 조회 전용입니다. (미래숲 보기에서 등록)'));
 return c}
function putDay(k,items,why,quiet){
